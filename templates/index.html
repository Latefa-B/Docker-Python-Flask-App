<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6f7ff; /* Light blue background */
            color: #2c3e50; /* Dark text */
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #0056b3; /* Darker blue for heading */
        }
        p {
            font-size: 1.2em;
        }
        .container {
            background-color: #ffffff;
            margin: 20px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ heading }}</h1>
        <p>{{ message }}</p>
        <p>The current time inside the container is: <strong>{{ current_time }}</strong></p>
        <p>This content is dynamic! It changes every time you refresh.</p>
    </div>
</body>
</html>
